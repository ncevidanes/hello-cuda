name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  host-tests:
    name: Testes de indexação
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compilar e executar testes
        run: make test

  cuda-build:
    name: Compilação CUDA
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - name: Instalar ferramentas de build
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            cmake \
            git \
            ninja-build
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v7

      - name: Mostrar versão do CUDA
        run: nvcc --version

      - name: Configurar
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Compilar
        run: cmake --build build --parallel

      - name: Executar testes sem GPU
        run: ctest --test-dir build --output-on-failure
